name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Run PHP static analysis
        run: composer analyse

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Build browser assets
        run: npm run build

      - name: Test browser-side regressions
        run: npm run test:javascript

      - name: Verify portal SQL update in isolated PostgreSQL
        run: npm run test:sql

      - name: Verify committed browser assets
        run: git diff --exit-code -- public/build

      - name: Run application tests
        run: php artisan test

  dependency-review:
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
