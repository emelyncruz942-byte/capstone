name: Security and tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Build browser assets
        run: npm run build

      - name: Test browser-side regressions
        run: npm run test:javascript

      - name: Verify portal SQL update in isolated PostgreSQL
        run: npm run test:sql

      - name: Verify committed browser assets
        run: git diff --exit-code -- public/build

      - name: Run application tests
        run: php artisan test
